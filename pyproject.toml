[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probe-agent"
version = "0.1.0"
description = "ProbeAgent — autonomous DevOps/SRE agent powered by Gemini."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "ProbeAgent Team" },
]
keywords = ["agent", "sre", "devops", "gemini", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "google-generativeai>=0.8",
    "httpx>=0.27",
    "structlog>=24.1",
    "docker>=7.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "opentelemetry-sdk>=1.25",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
probe-agent = "probe_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/probe_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
